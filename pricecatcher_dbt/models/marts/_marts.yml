version: 2

models:
  - name: dim_item
    columns:
      - name: item_code
        data_tests:
          - unique
          - not_null

  - name: dim_premise
    columns:
      - name: premise_code
        data_tests:
          - unique
          - not_null

  - name: fct_daily_prices
    columns:
      - name: price_key
        data_tests:
          - unique
          - not_null
      - name: price_date
        data_tests:
          - not_null
      - name: premise_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_premise')
                field: premise_code
      - name: item_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_item')
                field: item_code
      - name: price
        data_tests:
          - not_null